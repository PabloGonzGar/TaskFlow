<div class="overflow-x-auto w-full p-4 duration-300">
     <div *ngIf="this.modalUpdate">
        <div class="max-w-md mx-auto p-4 bg-white shadow-md rounded-lg mb-6">
            <form action="" >
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
                    <input type="text" [placeholder]="tag_to_update.name" [(ngModel)]="tag_to_update.name" name="nombre"
                        required
                        class="w-full px-5 py-3 border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500" />
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Color</label>
                        <div class="flex items-center gap-3">
                            <input type="color" [(ngModel)]="tag_to_update.color" name="color"
                                class="w-10 h-10 p-0 border-none rounded-xl cursor-pointer"
                                [placeholder]="this.tag_to_update.color" />
                            <span class="text-sm text-gray-600">{{ tag_to_update.color }}</span>
                        </div>
                </div>
                <div class="flex justify-end gap-2">
                    <button type="submit"
                        class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded"
                        (click)="guardarCategoria()">
                        Guardar
                    </button>
                    <button type="button" (click)="cancelar()"
                        class="bg-gray-400 hover:bg-gray-500 text-white font-bold py-2 px-4 rounded">
                        Cancelar
                    </button>
                </div>
            </form>
        </div>


    </div>

    <table class="min-w-full divide-y divide-gray-200 shadow-md rounded-lg overflow-hidden bg-white">
        <thead class="bg-stone-300">
            <tr>
                <th class="px-6 py-3 text-left text-md font-semibold text-gray-700">Nombre</th>
                <th class="px-6 py-3 text-left text-md font-semibold text-gray-700">Color</th>
                <th class="px-6 py-3 text-left text-md font-semibold text-gray-700">Acciones</th>
            </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
            <tr *ngFor="let categoria of tags" class="hover:bg-stone-100">
                <td class="px-6 py-4 text-md text-gray-800">
                    {{ categoria.name }}
                </td>
                <td class="px-6 py-4 text-md text-gray-800 flex items-center gap-2">
                    <span class="w-20 h-5 rounded-full" [ngStyle]="{ 'background-color': categoria.color }"></span>
                </td>
                <td class="px-6 py-4 text-md text-gray-800 ">
                    <button class="bg-blue-500 mr-5 hover:bg-blue-700 text-white font-bold py-1 px-4 rounded-full"
                        (click)="editarCategoria(categoria)">
                        Editar
                    </button>

                    <button class="bg-red-500 hover:bg-red-700 text-white font-bold py-1 px-4 rounded-full"
                        (click)="eliminarCategoria(categoria.id)">
                        Eliminar
                    </button>

                </td>
            </tr>
        </tbody>
    </table>


   
</div>
