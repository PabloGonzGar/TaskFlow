<div class="flex min-w-screen min-h-screen h-screen">
    <div class="fixed md:static flex flex-col w-64 md:w-3/12 h-screen border-r-2 px-10 py-7 bg-white z-20 transition-all duration-300"
        [ngClass]="{'hidden md:flex': !isSidebarOpen, 'flex': isSidebarOpen}">
        <img src="logo-name.svg" alt="" class="px-5 mt-4 w-full">
        <div class="flex-1 overflow-y-auto mt-20">
            <div class="principal flex flex-col gap-2 w-full">
                <h5 class="text-xl font-medium text-stone-600 px-5">Principal</h5>
                <a href=""
                    class="flex gap-3 items-center w-full rounded-md hover:bg-blue-100 hover:cursor-pointer px-5 py-2 hover:text-primary-100"
                    [routerLink]="['/dashboard']" routerLinkActive="bg-blue-200 text-primary-200"
                    [routerLinkActiveOptions]="{ exact: true }">
                    <img src="dash-icon.svg" alt="" width="30">
                    <p class="text-xl relative">Dashboard</p>
                </a>
                <a href=""
                    class="flex gap-3 items-center w-full rounded-md hover:bg-blue-100 hover:cursor-pointer px-5 py-2 hover:text-primary-100"
                    [routerLink]="['./tasks']" routerLinkActive="bg-blue-200 text-primary-200"
                    [routerLinkActiveOptions]="{ exact: true }">
                    <img src="tareas-icon.svg" alt="" width="30">
                    <p class="text-xl relative">Tareas</p>
                </a>
                <a href=""
                    class="flex gap-3 items-center w-full rounded-md hover:bg-blue-100 hover:cursor-pointer px-5 py-2 hover:text-primary-100"
                    [routerLink]="['./stats']" routerLinkActive="bg-blue-200 text-primary-200"
                    [routerLinkActiveOptions]="{ exact: true }">
                    <img src="stats.svg" alt="" width="30">
                    <p class="text-xl relative">Estadísticas</p>
                </a>
            </div>
        </div>

        <div class="border-t-2 pt-5" >
            <div
                (click)="this.activarConfigModal()"
                class="flex gap-3 items-center w-full rounded-md hover:bg-stone-300 hover:cursor-pointer px-5 py-2 hover:text-primary-100">
                <img src="config-icon.svg" alt="" width="30">
                <p class="text-xl relative text-stone-600">Configuracion</p>
            </div>
            <div 
                class="flex gap-3 items-center w-full rounded-md hover:bg-stone-300 hover:cursor-pointer px-5 py-2 hover:text-primary-100">
                <img src="perfil-icon.svg" alt="" width="30">
                <p class="text-xl relative text-stone-600">Perfil</p>
        </div>
            <button class="flex gap-3 items-center w-full rounded-md hover:bg-red-100 hover:cursor-pointer px-5 py-2 "
                (click)="logout()">
                <img src="logout.svg" alt="" width="30">
                <p class="text-xl relative text-red-500">Cerrar sesión</p>
            </button>
        </div>

        <button (click)="toggleSidebar()" class="absolute top-4 right-4 md:hidden p-2 rounded-full hover:bg-gray-200">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
    </div>

    <div *ngIf="this.configModal"
        class="fixed top-0 left-0 w-full h-full bg-black bg-opacity-50 flex justify-center items-center z-50" clickable
        (click)="this.activarConfigModal()">
        <div class="w-3/5 h-fit bg-white rounded-lg shadow-2xl px-5 py-20 flex flex-col gap-5 justify-center items-center"
            (click)="$event.stopPropagation()">
            <h1 class="text-4xl font-bold ">Elige tu propio estilo</h1>
            <p class="text-2xl font-medium text-stone-400">Se productivo a tu manera</p>
            <div class="w-full flex justify-center items-center flex-wrap gap-10">

                <div class="w-1/4 h-40 bg-gradient-to-tr from-red-500 to-orange-400 rounded-lg hover:cursor-pointer hover:-translate-y-2 duration-300"
                (click)="this.cambiarFondo('from-red-500 to-orange-400')">

                </div>
                <div class="w-1/4 h-40 bg-gradient-to-tr from-yellow-500 to-orange-400 rounded-lg hover:cursor-pointer hover:-translate-y-2 duration-300"
                (click)="this.cambiarFondo('from-yellow-500 to-orange-400')">

                </div>
                <div class="w-1/4 h-40 bg-gradient-to-tr from-purple-500 to-pink-400 rounded-lg hover:cursor-pointer hover:-translate-y-2 duration-300"
                (click)="this.cambiarFondo('from-purple-500 to-pink-400')">
                    
                </div>
                <div class="w-1/4 h-40 bg-gradient-to-tr from-green-400 to-sky-400 rounded-lg hover:cursor-pointer hover:-translate-y-2 duration-300" (click)="this.cambiarFondo('from-green-400 to-sky-400')">

                </div>
                <div class="w-1/4 h-40 bg-gradient-to-tr from-primary-100 to-primary-200 rounded-lg hover:cursor-pointer hover:-translate-y-2 duration-300" (click)="this.cambiarFondo('from-primary-100 to-primary-200')">

                </div>
                <div class="w-1/4 h-40 bg-gradient-to-tr from-black to-stone-500 rounded-lg hover:cursor-pointer hover:-translate-y-2 duration-300 " (click)="this.cambiarFondo('from-black to-stone-500')">

                </div>

            </div>


        </div>


    </div>



    <div *ngIf="isSidebarOpen" (click)="toggleSidebar()" class="fixed inset-0 bg-black bg-opacity-50 z-10 md:hidden">
    </div>

    <div class="flex-1 h-full overflow-y-auto pt-10 w-full">
        <div class="flex items-center h-header border-b-2 px-10 pb-10 shadow-lg">
            <div class="md:hidden">
                <button (click)="toggleSidebar()"
                    class="flex items-center justify-center p-2 rounded-md text-primary-100 hover:bg-blue-100 focus:outline-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                    <span class="sr-only">Abrir menu</span>
                </button>
            </div>

            <div class="flex-1 flex justify-end items-center gap-5">
                <p class="text-xl font-regular">Bienvenido, {{user.name}}!</p>

                <div class="bg-primary-100 rounded-full w-[50px] h-[50px] flex justify-center items-center">
                    <p class="text-3xl font-medium text-white">{{user.name.substr(0,1).toUpperCase()}}</p>
                </div>
            </div>
        </div>

        <div
            class="h-content w-full bg-gradient-to-tr {{this.color_fondo}} flex flex-col justify-center items-center">
            <div class="w-full h-full">
                <router-outlet></router-outlet>
            </div>
        </div>
    </div>
</div>
