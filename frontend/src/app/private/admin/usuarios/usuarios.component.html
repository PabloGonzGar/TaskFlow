<div class="overflow-x-auto w-full p-4">
  <table class="min-w-full divide-y divide-gray-200 shadow-md rounded-lg overflow-hidden bg-white">
    <thead class="bg-stone-300">
      <tr>
        <th class="px-6 py-3 text-left text-md font-semibold text-gray-700">Nombre</th>
        <th class="px-6 py-3 text-left text-md font-semibold text-gray-700">Correo</th>
        <th class="px-6 py-3 text-left text-md font-semibold text-gray-700">Administrador</th>
        <th class="px-6 py-3 text-left text-md font-semibold text-gray-700">Acciones</th>
      </tr>
    </thead>
    <tbody class="bg-white divide-y divide-gray-200">
      <tr *ngFor="let usuario of users" class="hover:bg-stone-100">

        <td class="px-6 py-4 whitespace-nowrap text-md text-gray-800">
          {{ usuario['name'] }}
        </td>
        <td class="px-6 py-4 whitespace-nowrap text-md text-gray-800">
          {{ usuario['email'] }}
        </td>
        <td class="px-6 py-4 whitespace-nowrap text-md">
          <span [ngClass]="usuario['is_admin'] ? 'text-green-600 font-semibold' : 'text-red-600 font-medium'">
            {{ usuario['is_admin'] ? 'Si' : 'No' }}
          </span>
        </td>
        <td>
          <button *ngIf="usuario['is_admin'] != true"
            class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-full"
            (click)="deleteUser(usuario['id'])">
            Eliminar
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
